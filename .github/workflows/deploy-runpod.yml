name: Deploy to RunPod

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RUNPOD_HOST: ${{ vars.RUNPOD_HOST }}
  RUNPOD_USER: root
  RUNPOD_PORT: ${{ vars.RUNPOD_PORT }}
  DEPLOY_DIR: ${{ secrets.RUNPOD_DEPLOY_DIR || '/workspace/Multi-agent-web-research-system' }}
  # RunPod has a GPU, so deploy installs CUDA PyTorch. Override this secret if the pod uses another CUDA version.
  RUNPOD_TORCH_INDEX_URL: ${{ secrets.RUNPOD_TORCH_INDEX_URL || 'https://download.pytorch.org/whl/cu121' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate RunPod connection variables
        run: |
          if [ -z "$RUNPOD_HOST" ]; then
            echo "RUNPOD_HOST repository variable is required."
            exit 1
          fi
          if [ -z "$RUNPOD_PORT" ]; then
            echo "RUNPOD_PORT repository variable is required."
            exit 1
          fi
          echo "Deploy target: $RUNPOD_USER@$RUNPOD_HOST:$RUNPOD_PORT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.RUNPOD_SSH_PRIVATE_KEY }}" > ~/.ssh/runpod_key
          chmod 600 ~/.ssh/runpod_key
          ssh-keyscan -p "$RUNPOD_PORT" "$RUNPOD_HOST" >> ~/.ssh/known_hosts

      - name: Build deployment archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.pycache' \
            --exclude='.pycache/**' \
            --exclude='__pycache__' \
            --exclude='__pycache__/**' \
            --exclude='*.pyc' \
            --exclude='data/chroma' \
            --exclude='data/*.db' \
            --exclude='data/shared_memory.json' \
            --exclude='data/browser_results.json' \
            --exclude='data/research_plan.json' \
            -czf /tmp/multi-agent-web-research-system.tar.gz .

      - name: Upload archive
        run: |
          SSH_OPTS="-i $HOME/.ssh/runpod_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30"
          ssh $SSH_OPTS -p "$RUNPOD_PORT" "$RUNPOD_USER@$RUNPOD_HOST" "mkdir -p '$DEPLOY_DIR'"
          scp $SSH_OPTS -P "$RUNPOD_PORT" /tmp/multi-agent-web-research-system.tar.gz "$RUNPOD_USER@$RUNPOD_HOST:/tmp/multi-agent-web-research-system.tar.gz"

      - name: Write remote environment file
        run: |
          cat > /tmp/runpod.env <<EOF
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY=${{ secrets.FIRECRAWL_API_KEY }}
          RAG_EMBEDDING_MODEL=${{ secrets.RAG_EMBEDDING_MODEL }}
          # Force sentence-transformers embeddings onto the GPU during RunPod deployments.
          RAG_EMBEDDING_DEVICE=${{ secrets.RAG_EMBEDDING_DEVICE || 'cuda' }}
          EOF
          SSH_OPTS="-i $HOME/.ssh/runpod_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30"
          scp $SSH_OPTS -P "$RUNPOD_PORT" /tmp/runpod.env "$RUNPOD_USER@$RUNPOD_HOST:$DEPLOY_DIR/.env"

      - name: Extract source on RunPod
        timeout-minutes: 5
        run: |
          SSH_OPTS="-i $HOME/.ssh/runpod_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30"
          ssh $SSH_OPTS -p "$RUNPOD_PORT" "$RUNPOD_USER@$RUNPOD_HOST" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_DIR"
          tar --no-same-owner --no-same-permissions -xzf /tmp/multi-agent-web-research-system.tar.gz -C "$DEPLOY_DIR"
          REMOTE

      - name: Install Python dependencies on RunPod
        timeout-minutes: 30
        run: |
          SSH_OPTS="-i $HOME/.ssh/runpod_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30"
          ssh $SSH_OPTS -p "$RUNPOD_PORT" "$RUNPOD_USER@$RUNPOD_HOST" "DEPLOY_DIR='$DEPLOY_DIR' TORCH_INDEX_URL='$RUNPOD_TORCH_INDEX_URL' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_DIR"
          # RunPod images often already include CUDA PyTorch. Recreate the venv with system packages
          # so we can reuse that GPU build instead of downloading multi-GB torch wheels each deploy.
          if [ ! -x .venv/bin/python ] || ! .venv/bin/python - <<'PY'
          import torch
          raise SystemExit(0 if torch.cuda.is_available() else 1)
          PY
          then
            rm -rf .venv
            python3 -m venv --system-site-packages .venv
          fi

          . .venv/bin/activate
          python -m pip install --upgrade pip

          # Fallback for minimal images that do not ship with GPU PyTorch.
          if python - <<'PY'
          import torch
          raise SystemExit(0 if torch.cuda.is_available() else 1)
          PY
          then
            echo "CUDA PyTorch is already available"
          else
            python -m pip install --upgrade --force-reinstall --index-url "$TORCH_INDEX_URL" torch
          fi
          timeout 25m python -m pip install --progress-bar off -r requirements.txt

          python -B - <<'PY'
          import numpy
          import torch
          import transformers

          if int(numpy.__version__.split(".", 1)[0]) >= 2:
              raise SystemExit(f"numpy must be <2 for compiled ML dependencies, found {numpy.__version__}")
          if tuple(int(part) for part in transformers.__version__.split(".")[:1]) >= (5,):
              raise SystemExit(f"transformers must be <5 for torch compatibility, found {transformers.__version__}")

          print("dependency compatibility ok")
          print("numpy", numpy.__version__)
          print("torch", torch.__version__)
          print("transformers", transformers.__version__)
          PY
          REMOTE

      - name: Install Playwright Chromium on RunPod
        timeout-minutes: 15
        run: |
          SSH_OPTS="-i $HOME/.ssh/runpod_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30"
          ssh $SSH_OPTS -p "$RUNPOD_PORT" "$RUNPOD_USER@$RUNPOD_HOST" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_DIR"
          . .venv/bin/activate
          timeout 10m python -m playwright install chromium
          DEBIAN_FRONTEND=noninteractive timeout 10m python -m playwright install-deps chromium || true
          REMOTE

      - name: Smoke test imports on RunPod
        timeout-minutes: 5
        run: |
          SSH_OPTS="-i $HOME/.ssh/runpod_key -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30"
          ssh $SSH_OPTS -p "$RUNPOD_PORT" "$RUNPOD_USER@$RUNPOD_HOST" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_DIR"
          . .venv/bin/activate
          set -a
          . .env
          set +a
          python -B - <<'PY'
          import torch
          from src.graph.research_workflow import run_research_graph
          from src.rag.indexing import index_research_results, select_embedding_device
          from src.rag.retrieval import hybrid_retrieve

          # Deployment should fail loudly when the GPU is not visible to PyTorch.
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is not available to PyTorch in the deploy venv")

          print("torch cuda ok", torch.__version__, torch.cuda.get_device_name(0))
          print("rag embedding device", select_embedding_device())
          print("deploy import ok")
          PY
          REMOTE
