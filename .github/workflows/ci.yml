name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  RUNPOD_HOST: ${{ vars.RUNPOD_HOST }}
  RUNPOD_PORT: ${{ vars.RUNPOD_PORT }}

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js for MCP tools
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check Node.js tools
        run: |
          node --version
          npm --version
          npx --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --progress-bar off -r requirements.txt

      - name: Check dependency compatibility
        run: |
          python -B - <<'PY'
          import numpy
          import torch
          import transformers

          if int(numpy.__version__.split(".", 1)[0]) >= 2:
              raise SystemExit(f"numpy must be <2 for compiled ML dependencies, found {numpy.__version__}")
          if tuple(int(part) for part in transformers.__version__.split(".")[:1]) >= (5,):
              raise SystemExit(f"transformers must be <5 for local torch compatibility, found {transformers.__version__}")

          print("dependency compatibility ok")
          print("numpy", numpy.__version__)
          print("torch", torch.__version__)
          print("transformers", transformers.__version__)
          PY

      - name: Check Python syntax
        run: |
          python -B -m compileall -q src scripts

      - name: Smoke test imports
        run: |
          python -B - <<'PY'
          from src.agents.browser_agent import BrowserAgent
          from src.agents.change_detection_agent import ChangeDetectionAgent
          from src.agents.planner_agent import PlannerAgent
          from src.graph.research_workflow import build_research_graph
          from src.rag.indexing import index_research_results
          from src.rag.retrieval import hybrid_retrieve

          build_research_graph()
          print("import smoke test ok")
          PY

      - name: Check whitespace
        run: |
          git diff --check
